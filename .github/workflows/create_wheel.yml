name: Build and test wheels

env:
  NR_JOBS: "4"

on:
  # needed to reuse the workflow from another one
  workflow_call:
    inputs:
      storm_version:
        description: 'Storm version used as base (e.g. 1.1.0)'
        required: true
        type: string
        default: 'x.y.z'
      version:
        description: 'Version to use for stormpy (e.g. 1.1.0 or 1.1.0.dev1). If empty, the version from the source is kept.'
        required: false
        type: string
        default: ''
      dev_build:
        description: 'Development build: use caching, only latest Python versions (3.13, 3.14)'
        required: true
        type: boolean
        default: false
      build_type:
        description: 'Build configuration (Release/Debug)'
        required: false
        type: string
        default: 'Release'
      repo:
        description: 'Repository to build from (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref (branch/tag/commit)'
        required: false
        type: string
        default: ''

  # needed to trigger the workflow manually
  workflow_dispatch:
    inputs:
      storm_version:
        description: 'Storm version used as base (e.g. 1.1.0)'
        required: true
        type: string
        default: 'x.y.z'
      version:
        description: 'Version to use for stormpy (e.g. 1.1.0 or 1.1.0.dev1)'
        required: true
        type: string
        default: 'x.y.z'
      dev_build:
        description: 'Development build: use caching, only latest Python versions (3.13, 3.14)'
        required: true
        type: boolean
        default: false
      build_type:
        description: 'Build configuration (Release/Debug)'
        required: false
        type: string
        default: 'Release'
      repo:
        description: 'Repository to build from (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref (branch/tag/commit)'
        required: false
        type: string
        default: ''

jobs:
  build_wheels:
    name: Build wheels for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        os: [ linux-intel, linux-arm, macos-intel, macos-arm ]
        include:
          # Set defaults
          - archs: auto
            platform: auto
            xcode: ""
            deploy_target: 13.0
          - os: linux-intel
            runs-on: ubuntu-latest
            archs: x86_64
            ccache-prefix: /host
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
            archs: aarch64
            ccache-prefix: /host
          - os: macos-intel
            runs-on: macos-15-intel # x86_64 runner
            xcode: latest-stable
            deploy_target: 15.0
            ccache-prefix: ""
          - os: macos-arm
            runs-on: macos-15 # ARM64 runners
            xcode: latest-stable
            deploy_target: 15.0
            ccache-prefix: ""
      fail-fast: false
    steps:
      - name: Git clone (default current repo)
        if: ${{ inputs.repo == '' }}
        uses: actions/checkout@v7
      - name: Git clone (custom repo)
        if: ${{ inputs.repo != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        if: ${{ matrix.xcode != '' }}
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Prepare version
        if: ${{ inputs.version != '' }}
        run: perl -i -pe 's/__version__ = "[^"]+"/__version__ = "'"${{ inputs.version }}"'"/' lib/stormpy/_version.py
      - name: Restore ccache
        if: ${{ inputs.dev_build }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.os }}-${{ inputs.build_type }}-${{ inputs.storm_version }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ inputs.build_type }}-${{ inputs.storm_version }}-
            ccache-${{ matrix.os }}-${{ inputs.build_type }}-
      - name: Get stormpy build dependencies
        if: ${{ inputs.dev_build }}
        id: build-deps
        # Parse requires from pyproject.toml to get dependencies
        run: |
          PYTHON_DEPS=$(python3 -c "
          import re
          with open('pyproject.toml') as f:
              text = f.read()
          m = re.search(r'requires\s*=\s*\[(.*?)\]', text, re.DOTALL)
          if m:
              deps = re.findall(r'\"([^\"]+)\"', m.group(1))
              print(' '.join(deps))
          ")
          echo "deps=$PYTHON_DEPS" >> "$GITHUB_OUTPUT"
      - name: Build wheels (development)
        if: ${{ inputs.dev_build }}
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.archs }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deploy_target }}
          # Build development version only on latest Python versions
          CIBW_BUILD: "cp313-* cp314-*"
          # Build without build isolation for better caching. Requires to install build dependencies beforehand.
          CIBW_BEFORE_BUILD: "pip install ${{ steps.build-deps.outputs.deps }}"
          CIBW_BUILD_FRONTEND: "build; args:--no-isolation"
          CIBW_ENVIRONMENT: >-
            STORM_VERSION=${{ inputs.storm_version }}
            NR_JOBS=${{ env.NR_JOBS }}
            CMAKE_BUILD_PARALLEL_LEVEL=${{ env.NR_JOBS }}
            SKBUILD_CMAKE_BUILD_TYPE=${{ inputs.build_type }}
            CMAKE_BUILD_TYPE=${{ inputs.build_type }}
            CCACHE_DIR=${{ matrix.ccache-prefix }}${{ runner.temp }}/ccache
            CCACHE_MAXSIZE=4G
            CCACHE_UMASK=0
            CCACHE_BASEDIR=${{ runner.workspace }}
            CCACHE_NOHASHDIR=true
            CCACHE_SLOPPINESS=file_macro
      - name: Build wheels (stable)
        if: ${{ !inputs.dev_build }}
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.archs }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deploy_target }}
          CIBW_ENVIRONMENT: >-
            STORM_VERSION=${{ inputs.storm_version }}
            NR_JOBS=${{ env.NR_JOBS }}
            CMAKE_BUILD_PARALLEL_LEVEL=${{ env.NR_JOBS }}
            SKBUILD_CMAKE_BUILD_TYPE=${{ inputs.build_type }}
            CMAKE_BUILD_TYPE=${{ inputs.build_type }}
      - name: ccache stats
        if: ${{ inputs.dev_build }}
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: ccache -s || true
      - uses: actions/upload-artifact@v7
        with:
          name: stormpy-wheels-${{ matrix.os }}-${{ inputs.build_type }}
          path: ./wheelhouse/*.whl


  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Git clone (default current repo)
        if: ${{ inputs.repo == '' }}
        uses: actions/checkout@v7
      - name: Git clone (custom repo)
        if: ${{ inputs.repo != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
      - name: Prepare version
        if: ${{ inputs.version != '' }}
        run: perl -i -pe 's/__version__ = "[^"]+"/__version__ = "'"${{ inputs.version }}"'"/' lib/stormpy/_version.py
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: stormpy-sdist
          path: dist/*.tar.gz


  test_wheels_linux:
    name: Test wheel on ${{ matrix.distro }} and ${{ matrix.arch.name }}
    needs: [build_wheels]
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - {name: linux-intel,
             runner: ubuntu-latest
          }
          - {name: linux-arm,
             runner: ubuntu-24.04-arm
          }
        distro:
          - ubuntu:latest
          - ubuntu:rolling
          - debian:latest
          - fedora:latest
          - archlinux:latest
        exclude:
          - arch: {name: linux-arm, runner: ubuntu-24.04-arm}
            distro: archlinux:latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: stormpy-wheels-${{ matrix.arch.name }}-${{ inputs.build_type }}
          path: dist
          merge-multiple: true
      - name: Checkout test files (default current repo)
        if: ${{ inputs.repo == '' }}
        uses: actions/checkout@v7
        with:
          path: dist/test_files
          sparse-checkout: |
            tests
      - name: Checkout test files (custom repo)
        if: ${{ inputs.repo != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: dist/test_files
          sparse-checkout: |
            tests
      - name: Install from wheel and test
        run: |
          docker run -i --rm -v ./dist:/wheel ${{ matrix.distro }} /bin/bash << 'EOF'
          set -euo pipefail
          set -x

          cd /wheel

          # Install Python & pip (varies per distro)
          if command -v apt; then
            apt update && DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt install -y python3 python3-pip python3-venv
          elif command -v dnf; then
            # libatomic is not shipped on fedora
            dnf install -y python3 python3-pip libatomic
          elif command -v pacman; then
            pacman -Syu --noconfirm python python-pip
          fi

          # Get major+minor version (e.g. "311" for Python 3.11)
          PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
          echo "Python version: $PY_VER"

          # Look for a matching wheel in the current directory
          WHEEL=$(ls stormpy-*-cp${PY_VER}-*.whl 2>/dev/null | head -n1 || true)
          echo "Found wheel: $WHEEL"
          if [ -z "$WHEEL" ]; then
            echo "Error: No stormpy wheel found for Python ${PY_VER:0:1}.${PY_VER:1}." >&2
            exit 1
          fi

          echo "Installing $WHEEL..."
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install "$WHEEL"

          # Run tests
          python3 -c "import stormpy; print('Import successful')"
          pip install pytest numpy
          pytest test_files/tests
          EOF


  test_wheels_mac:
    name: Test wheel on ${{ matrix.distro.name }}
    needs: [build_wheels]
    runs-on: ${{ matrix.distro.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - {name: "macOS 15, XCode 16.4, ARM",
             os: macos-arm,
             distro: "macos-15",
             xcode: "16.4"
          }
          - {name: "macOS 26, XCode Latest, ARM",
             os: macos-arm,
             distro: "macos-26",
             xcode: "latest-stable"
          }
          - {name: "macOS 27, XCode Latest, ARM",
             os: macos-arm,
             distro: "xcode-27",
             xcode: "latest"
          }
          - {name: "macOS 15, XCode Latest, Intel",
             os: macos-intel,
             distro: "macos-15-intel",
             xcode: "latest-stable"
          }
          - {name: "macOS 26, XCode Latest, Intel",
             os: macos-intel,
             distro: "macos-26-intel",
             xcode: "latest-stable"
          }
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.distro.xcode }}
      - uses: actions/download-artifact@v8
        with:
          pattern: stormpy-wheels-${{ matrix.distro.os }}-${{ inputs.build_type }}
          path: dist
          merge-multiple: true
      - name: Install from wheel
        working-directory: dist
        run: |
          # Get major+minor version (e.g. "311" for Python 3.11)
          PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
          echo "Python version: $PY_VER"
          # Look for a matching wheel in the current directory
          WHEEL=$(ls stormpy-*-cp${PY_VER}-*.whl 2>/dev/null | head -n1 || true)
          echo "Found wheel: $WHEEL"
          if [ -z "$WHEEL" ]; then
            echo "Error: No stormpy wheel found for Python ${PY_VER:0:1}.${PY_VER:1}." >&2
            exit 1
          fi
          echo "Installing $WHEEL..."
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install "$WHEEL"
      - name: Checkout test files (default current repo)
        if: ${{ inputs.repo == '' }}
        uses: actions/checkout@v7
        with:
          path: dist/test_files
          sparse-checkout: |
            tests
      - name: Checkout test files (custom repo)
        if: ${{ inputs.repo != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: dist/test_files
          sparse-checkout: |
            tests
      - name: Test
        working-directory: dist
        run: |
          source venv/bin/activate
          python3 -c "import stormpy; print('Import successful')"
          python3 -m pip install pytest numpy
          pytest test_files/tests
